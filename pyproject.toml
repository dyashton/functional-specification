[project]
name = "functionalspec"
version = "0.1.0"
description = "Functional Specifications: learnable behavioral latents for diverse molecular realization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "rdkit>=2023.9.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "torch>=2.1",
    "pyyaml>=6",
    "tqdm>=4.66",
    "selfies>=2.2.0",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["functionalspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
